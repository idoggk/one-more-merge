<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="One More Merge">
    <meta name="theme-color" content="#1b1f2a">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1b1f2a;
        overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #1b1f2a; outline: none; }
      #loading { position: fixed; left: 10%; right: 10%; top: 50%; text-align: center; color: #ffd36a;
        font: 700 20px/1.4 -apple-system, Helvetica, Arial, sans-serif; pointer-events: none; }
      #bar { margin-top: 12px; height: 10px; border-radius: 5px; background: #333a4d; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #ffb42e; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><span id="msg">Loading…</span><div id="bar"><div id="fill"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var msg = document.getElementById("msg");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (e) {
        msg.textContent = "Could not start: " + e;
      });
      // iOS Safari: stop pinch / double-tap zoom and rubber-banding.
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); });
      });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    </script>
  </body>
</html>
