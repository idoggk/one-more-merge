<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One More Merge - SCREW YARD mock</title>
<!--
  Static mock of the SCREW YARD (object yard: Dismantle and Collect). Spec: docs/art/mocks/screw-yard/SPEC.md
  Query: ?state=start|mid|danger|win|fail|screws  &grid=1 (8px grid + safe areas)  &names=1 (layer labels)  &audit=1  &t=<ms> (animation freeze)
  The viewport size IS the phone size (390x844, 360x780, 430x932). Art is referenced from src/assets/art (read only).
  The 3D object, its screws and the HUD plates are drawn in code here (proxy for the real art); magenta = MISSING art.
-->
<style>
:root{--ink:#2b1d2e;--cream:#fbe7c6;--cream2:#ecc98e;--gold:#ffcf33;--brass:#c8963a;--green:#3fbf5f;--red:#e8452c;--blue:#3a8bf0;--font:'Lilita One','Arial Black',Impact,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0f18;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
#phone{position:absolute;inset:0;overflow:hidden}
[data-layer]{position:absolute}
img{display:block;pointer-events:none}
.txt{font-family:var(--font);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.outl{color:#fff;text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink),-2px -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),0 3px 0 var(--ink)}
.c{text-align:center}
/* placeholders: hatch + magenta MISSING sticker */
.missing{outline:2px dashed #ff2bd6;outline-offset:-2px;background-image:repeating-linear-gradient(135deg,rgba(255,43,214,.28) 0 6px,rgba(255,255,255,.06) 6px 12px)}
.sticker{position:absolute;z-index:98;background:#ff2bd6;color:#fff;font:700 10px/14px Arial,sans-serif;padding:0 3px;border-radius:2px;letter-spacing:.2px;white-space:nowrap}
/* glossy plates */
.plate{border:4px solid var(--ink);border-radius:16px;background:linear-gradient(#5a4a66,#3a2c46 55%,#2b1d2e);box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.35);}
.cream{border:4px solid var(--ink);border-radius:16px;background:linear-gradient(#fff3d6,var(--cream) 50%,var(--cream2));box-shadow:inset 0 3px 0 #fff,inset 0 -3px 0 rgba(160,110,40,.35),0 4px 0 rgba(0,0,0,.3)}
.gbtn{border:4px solid var(--ink);border-radius:20px;background:linear-gradient(#8bf0a3 0,#3fc468 45%,#25994a 100%);box-shadow:inset 0 4px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,60,20,.35),0 5px 0 #14502a}
.bbtn{border:4px solid var(--ink);border-radius:20px;background:linear-gradient(#f0c070,#c8963a 50%,#9a6a22);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(80,40,0,.35),0 5px 0 #5a3a10}
.ctr{display:flex;align-items:center;justify-content:center}
/* ---- animation presets (spec: ANIMATION NOTES) ---- */
@keyframes spinOut{0%{transform:rotate(0) translateY(0) scale(1)}60%{transform:rotate(540deg) translateY(-10px) scale(1.25)}100%{transform:rotate(720deg) translateY(-6px) scale(1.1)}}
@keyframes popIn{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.25);opacity:1}78%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}50%{transform:scale(1.4) rotate(8deg);opacity:1}75%{transform:scale(.9) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes twinkle{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}50%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(45deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes dangerPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:.35}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tap{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-6px,-6px) scale(.92)}}
@keyframes rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes glint{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes fly{0%{transform:translate(0,0) scale(1) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) scale(.9) rotate(720deg)}}
@keyframes fade{0%{opacity:.85}100%{opacity:0}}
.a-bob{animation:bob 1.6s ease-in-out infinite}
.a-ring{animation:ringPulse .8s ease-in-out infinite}
.a-danger{animation:dangerPulse .6s ease-in-out infinite}
.a-shake{animation:shake .4s linear infinite}
.a-tw{animation:twinkle 1.6s ease-in-out infinite}
.a-rays{animation:rays 14s linear infinite}
.a-tap{animation:tap 1.2s ease-in-out infinite}
.glintwrap{overflow:hidden;position:relative}
.glintwrap::after{content:"";position:absolute;top:0;bottom:0;left:0;width:36%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:glint 2.6s ease-in-out infinite}
/* debug overlays */
#gridlay{position:absolute;inset:0;z-index:99;pointer-events:none;background-image:linear-gradient(to right,rgba(0,200,255,.28) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,200,255,.28) 1px,transparent 1px);background-size:8px 8px}
#gridlay::before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,0,120,.45) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,0,120,.45) 1px,transparent 1px);background-size:64px 64px}
.safe{position:absolute;left:0;right:0;background:rgba(255,40,40,.22);z-index:99;pointer-events:none;color:#fff;font:700 10px Arial}
.lbox{position:absolute;z-index:99;pointer-events:none;outline:1px solid rgba(255,255,0,.85)}
.lname{position:absolute;z-index:99;pointer-events:none;background:rgba(0,0,0,.72);color:#ff0;font:700 9px/11px Arial;padding:0 2px;white-space:nowrap}
pre#audit{position:fixed;left:0;top:0;z-index:999;background:#fff;color:#000;font:11px monospace}
</style></head>
<body><div id="phone"></div>
<svg width="0" height="0" style="position:absolute" id="defs"><defs>
  <radialGradient id="sg_R" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff9a80"/><stop offset=".5" stop-color="#e8452c"/><stop offset="1" stop-color="#9c2414"/></radialGradient>
  <radialGradient id="sg_U" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#9cc8ff"/><stop offset=".5" stop-color="#3a8bf0"/><stop offset="1" stop-color="#1b4fa8"/></radialGradient>
  <radialGradient id="sg_Y" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffc933"/><stop offset="1" stop-color="#c88a0a"/></radialGradient>
  <radialGradient id="sg_G" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#a8f5b4"/><stop offset=".5" stop-color="#3fbf5f"/><stop offset="1" stop-color="#1f7a38"/></radialGradient>
  <radialGradient id="sg_X" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#2a1a2e"/><stop offset="1" stop-color="#0e0712"/></radialGradient>
</defs></svg>
<script>
const A='../../../src/assets/art/';
const Q=new URLSearchParams(location.search);
const STATE=Q.get('state')||'mid', GRID=Q.get('grid')==='1', NAMES=Q.get('names')==='1', T=+(Q.get('t')||1400);
const W=+(Q.get('w')||390), H=+(Q.get('h')||844);
const C=Math.floor(W/8)*8, X0=(W-C)/2;          // 8px content column, centred
const SAFE_T=48, SAFE_B=32;
const HB=Math.floor(H/8)*8;                       // bottom-anchored layers hang from HB (840 / 776 / 928)
const INK='#2b1d2e';
const phone=document.getElementById('phone');phone.style.cssText=`position:absolute;left:0;top:0;width:${W}px;height:${H}px;overflow:hidden`;
const el=(tag,cls,st,parent,layer)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(st)Object.assign(e.style,st);if(layer)e.dataset.layer=layer;(parent||phone).appendChild(e);return e};
const img=(src,w,h,st,parent,cls)=>{const i=new Image();i.src=A+src+'.webp';i.style.cssText=`width:${w}px;height:${h}px;object-fit:contain`;if(cls)i.className=cls;if(st)Object.assign(i.style,st);(parent||phone).appendChild(i);return i};
const txt=(s,size,color,st,parent,cls)=>{const e=el('div','txt '+(cls||''),Object.assign({fontSize:size+'px',lineHeight:(size+4)+'px',color:color||INK},st||{}),parent);e.textContent=s;return e};
const sticker=(s,x,y,parent)=>{const e=el('div','sticker',{left:x+'px',top:y+'px'},parent);e.textContent='MISSING '+s;return e};
const ms=(w,h,x,y,name,parent)=>{const e=el('div','missing',{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:'8px'},parent);e.dataset.layer=name;return e};

/* ---------- state table ---------- */
const S={
 start :{obj:'cannon',removed:0,tray:[],taps:0,budget:36,stars:3,clock:'1:15',clockMode:'idle',danger:false,boxes:6,fill:0,bq:['R','U','Y'],coach:true},
 mid   :{obj:'cannon',removed:5,tray:['U','Y'],taps:14,budget:36,stars:3,clock:'0:52',clockMode:'calm',danger:false,boxes:3,fill:1,bq:['R','U','Y'],fly:true},
 danger:{obj:'cannon',removed:9,tray:['U','Y','G','U'],taps:27,budget:36,stars:1,clock:'0:09',clockMode:'red',danger:true,boxes:2,fill:2,bq:['Y','G','U']},
 win   :{obj:'cannon',removed:99,tray:[],taps:24,budget:36,stars:3,clock:'0:41',clockMode:'calm',danger:false,boxes:0,fill:3,bq:[],modal:'win',peak:2},
 fail  :{obj:'cannon',removed:11,tray:['U','Y','G','U','R'],taps:31,budget:36,stars:0,clock:'0:21',clockMode:'amber',danger:true,boxes:2,fill:1,bq:['G','U','Y'],modal:'fail',peak:5},
 screws:{obj:'bell',removed:0,tray:[],taps:0,budget:42,stars:3,clock:'1:30',clockMode:'idle',danger:false,boxes:6,fill:0,bq:['G','Y','R'],legend:true}
}[STATE];
const KC={R:'#e8452c',U:'#3a8bf0',Y:'#ffc933',G:'#3fbf5f'}, KN={R:'ROUND',U:'DIAMOND',Y:'TRIANGLE',G:'PLUS'}, KF={R:'CANNON',U:'COIL',Y:'BELL',G:'SUPPORT'};

/* ---------- screws (code-drawn proxy for the glossy screw heads) ---------- */
const SYM={R:'<circle cx="50" cy="50" r="14"/>',U:'<polygon points="50,31 69,50 50,69 31,50"/>',Y:'<polygon points="50,30 70,66 30,66"/>',G:'<path d="M43 30h14v13h13v14H57v13H43V57H30V43h13z"/>'};
const screwInner=(k,hole)=>hole?
 `<circle cx="50" cy="50" r="44" fill="url(#sg_X)" stroke="#2b1d2e" stroke-width="6"/><path d="M14 40a40 40 0 0 1 72 0" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="6"/>`:
 `<circle cx="50" cy="56" r="46" fill="rgba(0,0,0,.28)"/><circle cx="50" cy="50" r="46" fill="#2b1d2e"/><circle cx="50" cy="50" r="40" fill="url(#sg_${k})"/><circle cx="50" cy="50" r="33" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3"/>
  <g fill="rgba(255,255,255,.55)" transform="translate(0,3)">${SYM[k]}</g><g fill="rgba(43,29,46,.88)">${SYM[k]}</g>
  <ellipse cx="34" cy="30" rx="15" ry="8" fill="#fff" opacity=".75" transform="rotate(-32 34 30)"/><circle cx="68" cy="70" r="4" fill="#fff" opacity=".35"/>`;
const screwSVG=(k,px,hole)=>`<svg viewBox="0 0 100 100" width="${px}" height="${px}" style="display:block;overflow:visible">${screwInner(k,hole)}</svg>`;

/* ---------- 3D object (isometric blocks, light from top-left), copied from src/content/yardObjects.ts ---------- */
const OBJ={
 cannon:{pal:['#5b6575','#9a6234','#3a3340','#f08a2c','#7e8aa0'],b:[[1,0,1,2,'fR tG'],[1,0,-1,2,'bR tG'],[1,0,0,1,'lY'],[2,0,0,1,'fG bR rY'],[0,1,0,0,'fR bY lG'],[1,1,0,0,'fR bR tY'],[2,1,0,0,'fG bG tR'],[3,1,0,4,'fY bG rR tY'],[0,2,0,3,'fR lG tG']]},
 bell:{pal:['#8a5a33','#e8b42e','#4a4452','#b8832a'],b:[[0,0,0,0,'fR lG'],[2,0,0,2,'fY bR tU'],[4,0,0,0,'fR rG'],[0,1,0,0,'fG lU'],[4,1,0,0,'fG rU'],[0,2,0,0,'fU lG'],[4,2,0,0,'fU rG'],[1,1,0,1,'bY tG'],[2,1,0,1,'bY'],[3,1,0,1,'bY tG'],[1,1,1,1,'fY lY tR'],[2,1,1,1,'fY tY'],[3,1,1,1,'fY rY tR'],[2,2,0,1,'fG bU lR rY'],[0,3,0,3,'fR lU tY'],[1,3,0,3,'fG tY'],[2,3,0,3,'fU tG'],[3,3,0,3,'fG tY bR'],[4,3,0,3,'fR rU tY']]}
};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(h,t,a)=>{const c=hex(h),k=t==='w'?255:0;return'#'+c.map(v=>Math.round(v+(k-v)*a).toString(16).padStart(2,'0')).join('')};
function objectSVG(name,removed){
 const o=OBJ[name], S0=100, cx=.866*S0, cy=.5*S0;
 const P=(x,y,z)=>[(x-z)*cx,(x+z)*cy-y*S0];
 const has=(x,y,z)=>o.b.some(b=>b[0]===x&&b[1]===y&&b[2]===z);
 let pts=[];o.b.forEach(([x,y,z])=>{for(const dx of[0,1])for(const dy of[0,1])for(const dz of[0,1])pts.push(P(x+dx,y+dy,z+dz))});
 const minx=Math.min(...pts.map(p=>p[0]))-8,maxx=Math.max(...pts.map(p=>p[0]))+8,miny=Math.min(...pts.map(p=>p[1]))-8,maxy=Math.max(...pts.map(p=>p[1]))+36;
 const poly=(a,fill,extra='')=>`<polygon points="${a.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${fill}" stroke="#2b1d2e" stroke-width="5" stroke-linejoin="round" ${extra}/>`;
 let defs='',body='',scr='',sid=0,acc=0;
 const sorted=o.b.map((b,i)=>({b,i})).sort((p,q)=>(p.b[0]+p.b[2])-(q.b[0]+q.b[2])||p.b[1]-q.b[1]);
 const [bx0,by0]=P(0,0,0);
 // contact shadow
 const gx=(minx+maxx)/2, gy=P(0,0,0)[1]+ (o.b.length?0:0);
 const lowY=Math.max(...o.b.map(([x,y,z])=>P(x+1,y,z+1)[1]));
 body+=`<ellipse cx="${gx}" cy="${lowY+14}" rx="${(maxx-minx)*.46}" ry="${34}" fill="rgba(60,25,0,.32)"/><ellipse cx="${gx}" cy="${lowY+10}" rx="${(maxx-minx)*.3}" ry="${20}" fill="rgba(40,15,0,.35)"/>`;
 // number screws in a stable order (block order) to decide which are "removed": the visible ones, every 2nd first
 const vis=[];
 o.b.forEach(([x,y,z,t,s],bi)=>{s.split(' ').forEach(tok=>{const f=tok[0];if('frt'.includes(f)){const hid=(f==='f'&&has(x,y,z+1))||(f==='r'&&has(x+1,y,z))||(f==='t'&&has(x,y+1,z));if(!hid)vis.push({bi,tok})}})});
 const rem=new Set();{let n=0;const order=vis.map((_,i)=>i).sort((a,b)=>(a*7%vis.length)-(b*7%vis.length));for(const i of order){if(n>=removed)break;rem.add(i);n++}}
 sorted.forEach(({b:[x,y,z,t,s],i:bi})=>{
  const base=o.pal[t];const id=`g${bi}`;
  defs+=`<linearGradient id="${id}t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mix(base,'w',.42)}"/><stop offset="1" stop-color="${mix(base,'w',.16)}"/></linearGradient>
   <linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(base,'w',.12)}"/><stop offset="1" stop-color="${mix(base,'k',.14)}"/></linearGradient>
   <linearGradient id="${id}r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(base,'k',.26)}"/><stop offset="1" stop-color="${mix(base,'k',.46)}"/></linearGradient>`;
  const p=(dx,dy,dz)=>P(x+dx,y+dy,z+dz);
  const top=[p(0,1,1),p(1,1,1),p(1,1,0),p(0,1,0)], front=[p(0,0,1),p(1,0,1),p(1,1,1),p(0,1,1)], right=[p(1,0,1),p(1,0,0),p(1,1,0),p(1,1,1)];
  if(!has(x,y+1,z))body+=poly(top,`url(#${id}t)`);
  if(!has(x,y,z+1))body+=poly(front,`url(#${id}f)`);
  if(!has(x+1,y,z))body+=poly(right,`url(#${id}r)`);
  // gloss: sheen on top, bright rim on the lit (top-left) edges
  if(!has(x,y+1,z))body+=`<polygon points="${[top[3],top[0],p(.5,1,.55),p(.5,1,.25)].map(q=>q.join(',')).join(' ')}" fill="rgba(255,255,255,.22)"/><polyline points="${[top[0],top[3],top[2]].map(q=>q.join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(2,2)"/>`;
  if(!has(x,y,z+1))body+=`<polyline points="${[front[0],front[3],front[2]].map(q=>q.join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(5,0)"/>`;
  // screws on visible faces
  s.split(' ').forEach(tok=>{const f=tok[0],k=tok[1];if(!'frt'.includes(f))return;const hid=(f==='f'&&has(x,y,z+1))||(f==='r'&&has(x+1,y,z))||(f==='t'&&has(x,y+1,z));if(hid)return;
   const vi=vis.findIndex(v=>v.bi===bi&&v.tok===tok);const gone=rem.has(vi);
   let o2,U,V;
   if(f==='f'){o2=p(0,0,1);U=[cx,cy];V=[0,-S0]}else if(f==='r'){o2=p(1,0,1);U=[cx,-cy];V=[0,-S0]}else{o2=p(0,1,1);U=[cx,cy];V=[cx,-cy]}
   const m=[U[0]/100,U[1]/100,-V[0]/100,-V[1]/100,o2[0]+V[0],o2[1]+V[1]].map(v=>v.toFixed(4)).join(',');
   scr+=`<g transform="matrix(${m})"><g transform="translate(50,50) scale(.62) translate(-50,-50)" ${!gone&&STATE==='start'&&bi===5&&f==='f'?'class="tapme"':''}>${screwInner(k,gone)}</g></g>`;
   acc++;
  });
 });
 return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minx} ${miny} ${maxx-minx} ${maxy-miny}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="overflow:visible"><defs>${defs}</defs>${body}${scr}</svg>`,w:maxx-minx,h:maxy-miny,left:acc-rem.size,total:vis.length};
}

/* ---------- layers ---------- */
// L00 background (existing art) + strong top-left light
const bg=el('div',null,{left:0,top:0,width:W+'px',height:H+'px',zIndex:0},phone,'L00_bench_background');
img('sy_background',W,H,{objectFit:'cover',position:'absolute',left:0,top:0},bg);
el('div',null,{left:0,top:0,width:W+'px',height:H+'px',zIndex:2,background:'radial-gradient(ellipse 70% 42% at 28% 36%,rgba(255,244,200,.55),rgba(255,230,160,0) 70%),radial-gradient(ellipse 120% 80% at 50% 40%,rgba(0,0,0,0) 50%,rgba(40,15,0,.5) 100%)'},phone,'L02_key_light_and_vignette');

// HUD row 1: back, title, pause
const L=X0+16, R_=X0+C-16;
const back=el('div','plate ctr',{left:L+'px',top:'56px',width:'48px',height:'48px',zIndex:80,borderRadius:'24px'},phone,'L80_back_button');back.dataset.tap=1;
back.innerHTML='<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>';
const title=el('div','plate',{left:(X0+72)+'px',top:'56px',width:(C-144)+'px',height:'48px',zIndex:80},phone,'L80_title_plate');
txt('SCREW YARD',12,'#e8c98a',{position:'absolute',left:0,right:0,top:'2px',textAlign:'center',lineHeight:'16px'},title);
txt(STATE==='screws'?'BELL':'CANNON',22,'#ffd75e',{position:'absolute',left:0,right:0,top:'14px',textAlign:'center',lineHeight:'26px',textShadow:'0 2px 0 #000'},title);
const pause=el('div','plate ctr',{left:(X0+C-64)+'px',top:'56px',width:'48px',height:'48px',zIndex:80,borderRadius:'24px',background:'#f5e2b0',padding:0},phone,'L80_pause_button');pause.dataset.tap=1;
img('icon_pause',48,48,{position:'absolute',left:'-4px',top:'-4px',width:'48px',height:'48px'},pause);

// HUD row 2: taps / bonus clock / star meter
const r2=el('div',null,{left:L+'px',top:'112px',width:(C-32)+'px',height:'48px',zIndex:80,display:'flex',gap:'8px'},phone,'L80_stats_row');

    if(r.width<43.5||r.height<43.5)out.push(`TAP<44 ${L} ${r.width.toFixed(0)}x${r.height.toFixed(0)}`);

    if(m8(r.left-X0)>.6&&!(Math.abs((r.left+r.right)/2-(X0+C/2))<.6&&m8(r.left-X0)<=4.01)||m8(r.top)>.6)out.push(`GRID ${L} x${(r.left-X0).toFixed(1)} y${r.top.toFixed(1)}`)});
  for(let i=0;i<taps.length;i++)for(let j=i+1;j<taps.length;j++){const a=R(taps[i]),b=R(taps[j]);const ox=Math.min(a.right,b.right)-Math.max(a.left,b.left),oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);if(ox>2&&oy>2)out.push(`OVERLAP ${taps[i].dataset.layer} x ${taps[j].dataset.layer}`)}
  document.querySelectorAll('.txt').forEach(e=>{if(e.closest('.sticker,.lname'))return;const fs=parseFloat(getComputedStyle(e).fontSize);if(fs<12)out.push(`FONT<12 "${e.textContent.slice(0,14)}" ${fs}`);
    const par=e.parentElement,pr=R(par),rg=document.createRange();rg.selectNodeContents(e);const tr=rg.getBoundingClientRect();
    const inset=par.classList.contains('plate')||par.classList.contains('cream')||par.classList.contains('gbtn')||par.classList.contains('bbtn')?5:1;   // plates have a 4 px border: text must clear it
    if(tr.width>0&&par!==phone&&(tr.left<pr.left+inset-2||tr.right>pr.right-inset+2))out.push(`TEXT-OVER "${e.textContent.slice(0,18)}" ${tr.left.toFixed(0)}-${tr.right.toFixed(0)} in ${pr.left.toFixed(0)}-${pr.right.toFixed(0)}`)});
  // layer overlaps (not only taps): HUD / bubbles / chips / popups against each other; intentional pairs are whitelisted
  if(!modal){const ls=[...document.querySelectorAll('[data-layer]')].filter(e=>/^L(60|62|64|65|66|70|80)_/.test(e.dataset.layer)&&!e.parentElement.closest('[data-layer]'));
    const okPair=/L62_.*L60_|L60_.*L62_|L66_|L65_|L70_danger|L80_turn_label.*L80_turn_|L80_stats_row.*L80_(taps|bonus|star)|L80_(taps|bonus|star).*L80_stats_row/;
    for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){const a=R(ls[i]),b=R(ls[j]),n=ls[i].dataset.layer+' '+ls[j].dataset.layer;if(okPair.test(n))continue;
      const ox=Math.min(a.right,b.right)-Math.max(a.left,b.left),oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);if(ox>2&&oy>2)out.push(`LAYER-OVERLAP ${n} ${ox.toFixed(0)}x${oy.toFixed(0)}`)}
    // object drawn area vs bubbles / legend
    const st=document.querySelector('[data-layer="L50_object_stage"]'),sv=st.querySelector('svg'),vb=sv.viewBox.baseVal,sr=R(st),k=Math.min(sr.width/vb.width,sr.height/vb.height),dw=vb.width*k,dh=vb.height*k;
    const dr={left:sr.left+(sr.width-dw)/2,right:sr.left+(sr.width+dw)/2,top:sr.top+(sr.height-dh)/2,bottom:sr.top+(sr.height+dh)/2};
    document.querySelectorAll('[data-layer="L64_coach_bubble"],[data-layer="L64_warning_bubble"],[data-layer="L70_screw_legend"],[data-layer="L80_turn_label"]').forEach(e=>{const b=R(e);const ox=Math.min(dr.right,b.right)-Math.max(dr.left,b.left),oy=Math.min(dr.bottom-20,b.bottom)-Math.max(dr.top,b.top);if(ox>2&&oy>2)out.push(`OBJECT-COVERED by ${e.dataset.layer} ${oy.toFixed(0)}px`)});
    out.push(`INFO object ${dw.toFixed(0)}x${dh.toFixed(0)}`)}
  const pre=document.createElement('pre');pre.id='audit';pre.textContent=`AUDIT ${STATE} ${W}x${H} C=${C} X0=${X0}\n`+(out.filter(s=>!s.startsWith('INFO')).length?out.join('\n'):'CLEAN\n'+out.join('\n'));document.body.appendChild(pre);
}
const finish=()=>{document.getAnimations().forEach(a=>{try{a.pause();a.currentTime=T}catch(e){}});debug();if(Q.get('audit')==='1')audit();document.title='READY'};
setTimeout(finish,Q.get('audit')==='1'?300:60);
</script></body></html>
