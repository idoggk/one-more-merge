ar Xp Frame","w":1024,"h":165,"s":[0,1,0],"z":[0,1,0]},"ui_slider_track_v04":{"id":"ui_slider_track_v04","pass":4,"maker":18,"mine":18,"critic":"KEEP","note":"Near-twin of the XP frame (navy, thinner outline). Works as a pair but is not a distinct object at 70 px.","name":"Ui Slider Track","w":1024,"h":145,"s":[0,2,0],"z":[0,2,0]},"btn_yellow_v04":{"id":"btn_yellow_v04","pass":4,"maker":18,"mine":18,"critic":"KEEP","note":"Best button: orange-yellow face, bevelled brass rim, gloss band, darker lower lip, crisp outline. Benchmark for the other buttons.","name":"Btn Yellow","w":1024,"h":317,"s":[0,3,0],"z":[0,3,0]},"bar_fill_green_v02":{"id":"bar_fill_green_v02","pass":4,"maker":18,"mine":18,"critic":"KEEP","note":"Round left cap, flat cuttable right end, gloss strip. 88 px tall, so the gloss is thin but legible.","name":"Bar Fill Green","w":1024,"h":88,"s":[0,4,0],"z":[0,0,1]},"bar_fill_yellow_v02":{"id":"bar_fill_yellow_v02","pass":4,"maker":18,"mine":18,"critic":"KEEP","note":"Same construction as green, best contrast on dark.","name":"Bar Fill Yellow","w":1024,"h":90,"s":[0,5,0],"z":[0,1,1]},"ui_panel_card_v01":{"id":"ui_panel_card_v01","pass":4,"maker":18,"mine":18,"critic":"KEEP","note":"Gold bezel, cream face with a soft highlight, four rivets. Symmetric corners, so it is the cleanest 9-slice source of the panels. Outline is on the thin side.","name":"Ui Panel Card","w":819,"h":1024,"s":[0,6,0],"z":[0,2,1]},"ui_panel_std_v03":{"id":"ui_panel_std_v03","pass":4,"maker":18,"mine":18,"critic":"KEEP","note":"Thin gold bezel, symmetric rivet corners, empty centre. The corners notch inward, so use margins of at least 90 px at 1024 and keep the notch inside the corner slice.","name":"Ui Panel Std","w":1024,"h":1024,"s":[0,7,0],"z":[0,3,1]},"ui_slider_knob_v2":{"id":"ui_slider_knob_v2","pass":4,"maker":18,"mine":18,"critic":"KEEP","note":"Gold ring and cream dome, clean outline. 256 px, fine at 48 px.","name":"Ui Slider Knob","w":256,"h":256,"s":[0,0,1],"z":[0,0,2]},"ribbon_blue_v2":{"id":"ribbon_blue_v2","pass":6,"maker":18,"mine":18,"critic":"KEEP","note":"Flat blue band with curled tails, thick warm-brown outline, one gloss band. Clean on both backgrounds. Not a match for the green ribbon (see consistency).","name":"Ribbon Blue","w":1024,"h":220,"s":[0,1,1],"z":[0,1,2]},"ribbon_green_v3":{"id":"ribbon_green_v3","pass":6,"maker":18,"mine":18,"critic":"KEEP","note":"Brass-bezel plaque ribbon, crisp outline, strong gloss. Same build as ui_ribbon_gold_v04, so the gold, green pair is matched; the blue one is the odd one.","name":"Ribbon Green","w":1024,"h":250,"s":[0,2,1],"z":[0,2,2]},"btn_grey_v1":{"id":"btn_grey_v1","pass":6,"maker":18,"mine":17,"critic":"KEEP","note":"Slate face with a faint diagonal grain that reads as noise at 110 px; the outline is the thinnest of the button set. Acceptable as a disabled state.","name":"Btn Grey","w":1024,"h":334,"s":[0,3,1],"z":[0,3,2]},"btn_green_v3":{"id":"btn_green_v3","pass":6,"maker":18,"mine":18,"critic":"KEEP","note":"Emerald, brass rim, 4 percent outline, gloss band. The reference for the set.","name":"Btn Green","w":1024,"h":381,"s":[0,4,1],"z":[0,0,3]},"btn_blue_v3":{"id":"btn_blue_v3","pass":6,"maker":18,"mine":18,"critic":"KEEP","note":"Cobalt twin of the green button.","name":"Btn Blue","w":1024,"h":393,"s":[0,5,1],"z":[0,1,3]},"btn_pressed_v3":{"id":"btn_pressed_v3","pass":6,"maker":18,"mine":17,"critic":"KEEP","note":"One step darker, no gloss, still reads in grayscale. Close to a plain dark green, so the code must also move it down 2 px.","name":"Btn Pressed","w":1024,"h":380,"s":[0,6,1],"z":[0,2,3]},"tab_inactive_v2":{"id":"tab_inactive_v2","pass":6,"maker":18,"mine":17,"critic":"KEEP","note":"Cream face, same trapezoid, correct quiet value next to the active tab.","name":"Tab Inactive","w":1024,"h":569,"s":[0,7,1],"z":[0,3,3]},"ui_tab_active":{"id":"ui_tab_active","pass":7,"maker":18,"mine":17,"critic":"KEEP","note":"The CRITIQUE_6 fix is met: saturated orange face, pale brass rim, thick dark brown outline, one gloss band, and in grayscale the face is two steps darker than the rim and darker than the white inactive tab.","name":"Ui Tab Active","w":1024,"h":415,"s":[0,0,2],"z":[1,0,0]}},"atlas":{"g":[{"f":"img/ui-kit_0.webp","cols":8,"rows":3}],"z":[{"f":"img/ui-kit_zoom_0.webp","cols":4,"rows":4},{"f":"img/ui-kit_zoom_1.webp","cols":1,"rows":1}]},"redoText":[]}};</script><script src="app.js"></script></body></html>
