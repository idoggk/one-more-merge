 and gold rim and a gloss band. The one red object in the tool set, justified as a warning state.","cat":"Icons, markers and chips","name":"Tool Chip Nothing","w":256,"h":256,"s":[0,3,1],"z":[0,3,2]},"tool_recipe_strip":{"id":"tool_recipe_strip","pass":7,"maker":18,"mine":17,"critic":"KEEP","note":"Cream strip with two round sockets in a brass rim. Sockets are smallish and transparent, so the code must draw icon discs behind them.","cat":"Icons, markers and chips","name":"Tool Recipe Strip","w":256,"h":256,"s":[0,4,1],"z":[0,0,3]},"fx_row_surge_1":{"id":"fx_row_surge_1","pass":7,"maker":18,"mine":17,"critic":"KEEP","note":"Small violet charge glow. Reads as a build-up, small on purpose.","cat":"Effect frames","name":"Fx Row Surge 1","w":508,"h":508,"s":[0,5,1],"z":[0,1,3]},"fx_row_surge_2":{"id":"fx_row_surge_2","pass":7,"maker":18,"mine":18,"critic":"KEEP","note":"Flare with a gold bolt each side. The best readable \"starts to travel\" frame.","cat":"Effect frames","name":"Fx Row Surge 2","w":508,"h":508,"s":[0,6,1],"z":[0,2,3]},"fx_row_surge_3":{"id":"fx_row_surge_3","pass":7,"maker":18,"mine":18,"critic":"KEEP","note":"Thin bright bar, 14 px short of the cell edge, alpha 5 on the border.","cat":"Effect frames","name":"Fx Row Surge 3","w":508,"h":508,"s":[0,7,1],"z":[0,3,3]},"fx_row_surge_6":{"id":"fx_row_surge_6","pass":7,"maker":18,"mine":17,"critic":"KEEP","note":"Faint afterglow with two sparks, clean edges (alpha 3).","cat":"Effect frames","name":"Fx Row Surge 6","w":508,"h":508,"s":[0,0,2],"z":[1,0,0]},"fx_gear_bomb_1":{"id":"fx_gear_bomb_1","pass":7,"maker":18,"mine":17,"critic":"KEEP","note":"Tiny fuse spark with a white core.","cat":"Effect frames","name":"Fx Gear Bomb 1","w":512,"h":512,"s":[0,1,2],"z":[1,1,0]},"fx_gear_bomb_2":{"id":"fx_gear_bomb_2","pass":7,"maker":18,"mine":18,"critic":"KEEP","note":"Swelling ball with gear-tooth rays: the \"gear\" in the name shows.","cat":"Effect frames","name":"Fx Gear Bomb 2","w":512,"h":512,"s":[0,2,2],"z":[1,2,0
