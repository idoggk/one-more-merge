          t += "\n\n--- last " + ring.length + " log lines ---\n" + ring.join("\n") + "\n\nbuild c6da4a7 2026-10-22 22:38Z | " + navigator.userAgent;
          $("omm-sheet-text").textContent = t;

        productVersion: "1.0",
        // Replaces the loader's modal "Script error." dialog: record the real text; true = the loader shows nothing itself.
        errorHandler: function (message, filename, lineno) {
          if (window.ommDiag) window.ommDiag.report("unity", message, filename, lineno, "");
          return true;
        },
        printErr: function (t) { console.error(t); },
      }, function (p) {
        // ?freeze=60 holds the cover at 60% and never fades (screenshot testing).
        var shown = freeze === null ? p : Math.min(p, freeze / 100);
        document.getElementById("fill").style.width = "calc(var(--u) * " + (620 * shown) + ")";
        msg.textContent = "Loading… " + Math.round(100 * shown) + "%";
      }).then(function (instance) {
        window.unityInstance = instance; // read by the memory checks (Module.HEAPU32.buffer.byteLength)
        if (freeze !== null) return;
        // The cover stays fully opaque until Unity says the title is drawn (OMM_PageReady); 3 s fallback for entries without a title.
        setTimeout(window.ommReady, 3000);
      }).catch(function (e) {
        msg.textContent = "Could not start: " + e;
      });
      // Safe-area insets for Unity (CSS px). A probe element resolves env(); read each call, so rotation and toolbar changes are picked up.
      var insetProbe = document.createElement("div");
      insetProbe.id = "omm-probe";
      insetProbe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
        "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
      document.body.appendChild(insetProbe);
      window.ommInsets = function () {
        var cs = getComputedStyle(insetProbe), c = document.getElementById("unity-canvas"), r = c.getBoundingClientRect();
        var n = function (v) { v = parseFloat(v); return isFinite(v) && v > 0 ? v : 0; };
        return [n(cs.paddingTop), n(cs.paddingRight), n(cs.paddingBottom), n(cs.paddingLeft), r.width, r.height].join(",");
      };
      // Safari's toolbar collapsing / rotation: Unity follows the canvas CSS size itself; nudge a resize once the size settles (debounced).
      (function () {
        var t = 0;
        function relayout() {
          clearTimeout(t);
          t = setTimeout(function () {
            try { window.dispatchEvent(new Event("resize")); } catch (e) { /* layout aid only */ }
          }, 120);
        }
        if (window.visualViewport) window.visualViewport.addEventListener("resize", relayout);
        window.addEventListener("orientationchange", relayout);
      })();
      // iOS Safari: stop pinch / double-tap zoom and rubber-banding.
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); });
      });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    </script>
  </body>
